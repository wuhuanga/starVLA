run_id: starvla_bayesian_cag
run_root_dir: results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false


framework:
  name: BayesianCAG
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen2.5-VL-3B-Instruct-Action
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
    num_latent_action_query: 32
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: True
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

  reduce_in_full_precision: true

  # =====================================================================
  # BayesianVLA (LangForce) training hyper-parameters
  # =====================================================================
  kl_weight: 0.1                    # weight for LLR maximisation loss
  prior_loss_weight: 0.3            # weight for prior branch action loss
  assert_lang_span_match: true      # enforce token-level span equality
  detach_prior_cond: true           # detach prior to prevent vision-only drift
  use_hard_token_llr: true          # use top-k hardest tokens for LLR
  hard_token_k: 16                  # top-k hardest tokens
  use_kl_gate: true                 # gate LLR by posterior NLL
  kl_gate_momentum: 0.99            # EMA momentum for gate threshold
  kl_gate_temp: 0.5                 # temperature for gate sigmoid
  kl_gate_tau_scale: 0.7
  kl_gate_min: 0.0
  kl_gate_max: 1.0

  # =====================================================================
  # Latent Contrastive Alignment (InfoNCE) — training
  # =====================================================================
  contrastive_weight: 0.1           # weight for InfoNCE loss (delta_h vs lang_emb)
  contrastive_tau: 0.07             # InfoNCE temperature

  # =====================================================================
  # CAG inference hyper-parameters
  # =====================================================================
  guidance_omega: 2.0               # max guidance scale (1.0 = standard posterior only)
  guidance_mode: latent             # "latent" (token-wise dynamic) | "action" | "velocity"
  omega_base: 1.0                   # min per-token omega (only used in latent mode)


datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_all
    action_type: delta_qpos
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    per_device_batch_size: 16
    load_all_data_for_training: true
    obs: ["image_0"]
    video_backend: torchvision_av


trainer:
  epochs: 100
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
